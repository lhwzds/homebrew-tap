name: Update Formula

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update the formula to (e.g. 0.2.1). Leave empty to use the latest release.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  update-codocia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            TAG=$(gh release view --repo lhwzds/codocia --json tagName --jq .tagName)
            # Codocia's release workflow only runs for v* tags
            if [[ "$TAG" != v* ]]; then
              echo "::error::Latest release tag '$TAG' does not start with v"
              exit 1
            fi
            VERSION="$TAG"
          fi
          # strip a leading "v" (e.g. v0.2.1 -> 0.2.1)
          VERSION="${VERSION#v}"

          # only plain versions are accepted (the whole string, newlines included),
          # so the value can never inject shell commands, step outputs or URL parts
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version: '$VERSION'"
            exit 1
          fi

          CURRENT=$(grep -E '^[[:space:]]*version[[:space:]]+"' Formula/codocia.rb | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CURRENT=$CURRENT" >> $GITHUB_OUTPUT

          if [ "$VERSION" = "$CURRENT" ]; then
            echo "codocia formula already at $VERSION"
            echo "UPDATED=false" >> $GITHUB_OUTPUT
          else
            echo "Updating codocia formula: ${CURRENT:-unknown} -> $VERSION"
            echo "UPDATED=true" >> $GITHUB_OUTPUT
          fi

      - name: Download checksums
        if: steps.version.outputs.UPDATED == 'true'
        # the version is handed over through the environment, so that it is
        # never interpolated into the shell script itself
        env:
          VERSION: ${{steps.version.outputs.VERSION}}
        run: |
          # outside the checkout, so the commit can only contain the formula
          curl -fsSL "https://github.com/lhwzds/codocia/releases/download/v${VERSION}/checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cat "$RUNNER_TEMP/checksums.txt"

      - name: Extract SHA256 hashes
        id: sha
        if: steps.version.outputs.UPDATED == 'true'
        run: |
          # exactly one line per archive, and a 64-character hex hash, before any
          # value is written to the step outputs or into the Ruby formula
          hash_for() {
            local lines
            lines=$(awk -v f="codocia-$1.tar.gz" '$2 == f || $2 == "*" f {print $1}' "$RUNNER_TEMP/checksums.txt")
            if [[ $(printf '%s\n' "$lines" | grep -c .) -ne 1 || ! "$lines" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Expected one SHA256 for codocia-$1.tar.gz in checksums.txt" >&2
              exit 1
            fi
            printf '%s' "$lines"
          }
          ARM_MAC=$(hash_for aarch64-apple-darwin)
          X86_MAC=$(hash_for x86_64-apple-darwin)
          ARM_LINUX=$(hash_for aarch64-unknown-linux-gnu)
          X86_LINUX=$(hash_for x86_64-unknown-linux-gnu)

          echo "ARM_MAC=$ARM_MAC" >> "$GITHUB_OUTPUT"
          echo "X86_MAC=$X86_MAC" >> "$GITHUB_OUTPUT"
          echo "ARM_LINUX=$ARM_LINUX" >> "$GITHUB_OUTPUT"
          echo "X86_LINUX=$X86_LINUX" >> "$GITHUB_OUTPUT"

      - name: Update formula
        if: steps.version.outputs.UPDATED == 'true'
        env:
          VERSION: ${{steps.version.outputs.VERSION}}
          ARM_MAC: ${{steps.sha.outputs.ARM_MAC}}
          X86_MAC: ${{steps.sha.outputs.X86_MAC}}
          ARM_LINUX: ${{steps.sha.outputs.ARM_LINUX}}
          X86_LINUX: ${{steps.sha.outputs.X86_LINUX}}
        run: |
          require_hash() {
            if [ -z "$1" ]; then
              echo "::error::Refusing to write the formula with an empty SHA256 hash ($2)"
              exit 1
            fi
          }
          require_hash "$ARM_MAC" ARM_MAC
          require_hash "$X86_MAC" X86_MAC
          require_hash "$ARM_LINUX" ARM_LINUX
          require_hash "$X86_LINUX" X86_LINUX

          cat > Formula/codocia.rb << EOF
          class Codocia < Formula
            desc "Notebook for AI coding agents that compiles source-grounded docs"
            homepage "https://github.com/lhwzds/codocia"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/lhwzds/codocia/releases/download/v#{version}/codocia-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_MAC}"
              else
                url "https://github.com/lhwzds/codocia/releases/download/v#{version}/codocia-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_MAC}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/lhwzds/codocia/releases/download/v#{version}/codocia-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${ARM_LINUX}"
              else
                url "https://github.com/lhwzds/codocia/releases/download/v#{version}/codocia-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_LINUX}"
              end
            end

            def install
              bin.install "codocia"
            end

            test do
              assert_match "Codocia Skill", shell_output("#{bin}/codocia skill")
            end
          end
          EOF

      - name: Commit and push
        if: steps.version.outputs.UPDATED == 'true'
        env:
          VERSION: ${{steps.version.outputs.VERSION}}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/codocia.rb
          if git diff --cached --quiet; then
            echo "No formula changes detected."
            exit 0
          fi
          git commit -m "Update codocia to $VERSION"
          git push
